<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Protótipo Interativo Multi-Dispositivo (Liquid Glass)</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #070a12;
      color: #f8fafc;
    }

    /* Fundo ambiental do estúdio — iluminação suave, paleta sóbria e camadas de profundidade */
    .studio-bg {
      background:
        radial-gradient(circle at 18% 16%, rgba(124, 106, 214, 0.16), transparent 44%),
        radial-gradient(circle at 84% 78%, rgba(72, 169, 197, 0.13), transparent 46%),
        radial-gradient(circle at 52% 48%, rgba(30, 41, 66, 0.48), #070a12 84%);
    }

    /* =========================================================================
       SISTEMA DE DESIGN LIQUID GLASS (VIDRO ÓPTICO TRANSLÚCIDO + LUZ ESPECULAR)
       ========================================================================= */
    .app-ambient-bg {
      background:
        radial-gradient(90% 60% at 15% 10%, rgba(139, 118, 224, 0.22), transparent 62%),
        radial-gradient(80% 55% at 88% 22%, rgba(78, 174, 206, 0.18), transparent 60%),
        radial-gradient(75% 60% at 50% 92%, rgba(176, 118, 184, 0.15), transparent 62%),
        linear-gradient(165deg, #0b101d 0%, #0f1628 48%, #0a0f1c 100%);
    }

    @keyframes ambientDrift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(14px, -12px, 0) scale(1.06); }
    }

    .ambient-orb {
      animation: ambientDrift 14s ease-in-out infinite;
      pointer-events: none;
    }

    /* Superfície flutuante Liquid Glass (barras, cápsulas de navegação, HUD) */
    .lg-bar {
      position: relative;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(226, 232, 240, 0.06) 45%,
        rgba(148, 163, 184, 0.09) 100%
      );
      backdrop-filter: blur(26px) saturate(175%);
      -webkit-backdrop-filter: blur(26px) saturate(175%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 14px 36px rgba(2, 6, 23, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.36),
        inset 0 -1px 0 rgba(255, 255, 255, 0.07);
    }

    /* Painéis e cartões frosted Liquid Glass com alta legibilidade */
    .lg-panel {
      position: relative;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.10) 0%,
        rgba(203, 213, 225, 0.045) 50%,
        rgba(15, 23, 42, 0.38) 100%
      );
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        0 10px 28px rgba(2, 6, 23, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.24),
        inset 0 -1px 0 rgba(255, 255, 255, 0.04);
    }

    /* Folha modal Liquid Glass (mais fosca para garantir contraste de leitura) */
    .lg-sheet {
      position: relative;
      background: linear-gradient(
        155deg,
        rgba(30, 41, 66, 0.84) 0%,
        rgba(15, 23, 42, 0.90) 55%,
        rgba(11, 17, 32, 0.94) 100%
      );
      backdrop-filter: blur(30px) saturate(165%);
      -webkit-backdrop-filter: blur(30px) saturate(165%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 24px 60px rgba(2, 6, 23, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.32),
        inset 0 -1px 0 rgba(255, 255, 255, 0.06);
    }

    /* Cápsulas e botões de vidro translúcido */
    .lg-pill {
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.13) 0%, rgba(255, 255, 255, 0.05) 100%);
      backdrop-filter: blur(18px) saturate(155%);
      -webkit-backdrop-filter: blur(18px) saturate(155%);
      border: 1px solid rgba(255, 255, 255, 0.19);
      box-shadow:
        0 6px 18px rgba(2, 6, 23, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.16s ease, box-shadow 0.2s ease;
    }

    .lg-pill:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.19) 0%, rgba(255, 255, 255, 0.08) 100%);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Botão primário em vidro líquido tingido (paleta sóbria lilás/índigo) */
    .lg-btn-primary {
      position: relative;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.80) 0%, rgba(99, 102, 241, 0.74) 55%, rgba(56, 189, 248, 0.64) 100%);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow:
        0 10px 26px rgba(99, 102, 241, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: all 0.2s ease;
    }

    .lg-btn-primary:hover {
      filter: brightness(1.08);
      box-shadow:
        0 12px 30px rgba(124, 58, 237, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    /* Lente ativa para abas e controles segmentados */
    .lg-active-lens {
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.24) 0%, rgba(196, 181, 253, 0.16) 100%);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow:
        0 4px 14px rgba(2, 6, 23, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    /* Brilho especular interativo que acompanha o ponteiro em superfícies Liquid Glass */
    .lg-sheen::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.28s ease;
      background: radial-gradient(
        180px circle at var(--lg-x, 50%) var(--lg-y, 20%),
        rgba(255, 255, 255, 0.16),
        transparent 68%
      );
    }

    .lg-sheen:hover::before {
      opacity: 1;
    }

    /* Cabeçalho flutuante sutil em vidro */
    .lg-header {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.62) 0%, rgba(15, 23, 42, 0.38) 100%);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.11);
    }

    /* Scrollbars discretas dentro das telas dos dispositivos */
    .orbit-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .orbit-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .orbit-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }
    .orbit-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Canvas pixel art nítido */
    .pixel-canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* =========================================================================
       MOLDURAS REALISTAS DOS DISPOSITIVOS (LAPTOP, SMARTPHONE, SMARTWATCH)
       ========================================================================= */
    #device-scaler {
      transform-origin: center center;
      will-change: transform;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 1. Laptop (Computador) */
    .laptop-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 36px 70px rgba(0, 0, 0, 0.7));
    }

    .laptop-lid {
      background: linear-gradient(160deg, #272c3a 0%, #141821 45%, #0c0f16 100%);
      padding: 16px 16px 14px 16px;
      border-radius: 24px 24px 10px 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      position: relative;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    .laptop-camera {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.18);
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
    }

    .laptop-screen {
      width: 1160px;
      height: 720px;
      border-radius: 12px;
      overflow: hidden;
      background: #0b101d;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.11);
    }

    .laptop-base {
      width: 1270px;
      height: 20px;
      background: linear-gradient(180deg, #334155 0%, #1e293b 45%, #0f172a 100%);
      border-radius: 4px 4px 16px 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: none;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .laptop-notch {
      width: 132px;
      height: 6px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 0 0 8px 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: none;
    }

    /* 2. Smartphone (Celular 9:16) */
    .phone-shell {
      position: relative;
      padding: 13px;
      border-radius: 56px;
      background: linear-gradient(155deg, #2d3446 0%, #161b26 42%, #0c0f17 100%);
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 34px 70px rgba(0, 0, 0, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.34),
        inset 0 0 0 2px rgba(0, 0, 0, 0.55);
    }

    .phone-btn-left-1, .phone-btn-left-2, .phone-btn-right {
      position: absolute;
      background: #2d3548;
      border-radius: 3px;
    }
    .phone-btn-left-1 { left: -4px; top: 152px; width: 4px; height: 42px; }
    .phone-btn-left-2 { left: -4px; top: 206px; width: 4px; height: 42px; }
    .phone-btn-right { right: -4px; top: 185px; width: 4px; height: 64px; }

    .phone-screen {
      width: 390px;
      height: 800px;
      border-radius: 44px;
      overflow: hidden;
      background: #0b101d;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 3. Smartwatch (Apple Watch 45mm) */
    .watch-assembly {
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 30px 55px rgba(0, 0, 0, 0.75));
    }

    .watch-band-top, .watch-band-bottom {
      width: 176px;
      height: 76px;
      background: linear-gradient(90deg, #151924 0%, #242b3d 50%, #151924 100%);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .watch-band-top {
      border-radius: 24px 24px 0 0;
      margin-bottom: -14px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    .watch-band-bottom {
      border-radius: 0 0 24px 24px;
      margin-top: -14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .watch-case {
      position: relative;
      padding: 16px;
      border-radius: 74px;
      background: linear-gradient(150deg, #3b4256 0%, #191e2b 55%, #0c0f17 100%);
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.35),
        inset 0 -3px 6px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    .watch-crown {
      position: absolute;
      right: -11px;
      top: 86px;
      width: 11px;
      height: 54px;
      border-radius: 5px;
      background: repeating-linear-gradient(180deg, #64748b 0px, #64748b 3px, #1e293b 3px, #1e293b 6px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .watch-side-btn {
      position: absolute;
      right: -6px;
      top: 164px;
      width: 6px;
      height: 62px;
      border-radius: 3px;
      background: #334155;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .watch-screen {
      width: 272px;
      height: 330px;
      border-radius: 58px;
      overflow: hidden;
      background: #060914;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="studio-bg flex h-screen w-screen overflow-hidden select-none">

  <!-- =========================================================================
       BARRA LATERAL ESQUERDA DO ESTÚDIO (INSPECTOR DE DISPOSITIVOS)
       ========================================================================= -->
  <aside class="z-30 flex flex-col items-center justify-between w-16 sm:w-[78px] h-full bg-white/[0.03] backdrop-blur-2xl border-r border-white/[0.12] shadow-[inset_-1px_0_0_rgba(255,255,255,0.06)] py-4 shrink-0">
    <!-- Logo Orbit brilhante -->
    <div class="flex flex-col items-center gap-1.5">
      <button type="button" onclick="resetToHome()" title="Orbit — Início" class="lg-pill lg-sheen group relative w-11 h-11 rounded-2xl p-[1.5px] transition-transform active:scale-95">
        <div class="w-full h-full rounded-[14px] bg-gradient-to-br from-violet-500/30 via-indigo-500/20 to-cyan-400/25 flex items-center justify-center">
          <svg class="w-6 h-6 text-violet-200" viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="5.5" fill="url(#orbitCore)"/>
            <ellipse cx="16" cy="16" rx="13" ry="5.5" transform="rotate(-28 16 16)" stroke="url(#orbitRing)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="25.5" cy="11" r="2.2" fill="#67e8f9"/>
            <defs>
              <linearGradient id="orbitCore" x1="10" y1="10" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#e9d5ff"/>
                <stop offset="1" stop-color="#818cf8"/>
              </linearGradient>
              <linearGradient id="orbitRing" x1="3" y1="16" x2="29" y2="16" gradientUnits="userSpaceOnUse">
                <stop stop-color="#c4b5fd"/>
                <stop offset="1" stop-color="#67e8f9"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </button>
      <span class="text-[10px] font-bold tracking-[0.18em] uppercase text-slate-300/80">Orbit</span>
    </div>

    <!-- Seletor de Dispositivos (Computador, Celular, Relógio) -->
    <div class="flex flex-col items-center gap-3">
      <button type="button" id="dock-desktop" onclick="switchDevice('desktop')" title="Modo Computador (Notebook)" class="dock-btn lg-sheen relative w-12 h-12 rounded-2xl flex items-center justify-center transition-all">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="12" rx="2"/>
          <path d="M2 20h20"/>
        </svg>
      </button>
      <span class="text-[9px] font-semibold uppercase tracking-wider text-slate-400 -mt-2">Desktop</span>

      <button type="button" id="dock-mobile" onclick="switchDevice('mobile')" title="Modo Celular (Smartphone 9:16)" class="dock-btn lg-sheen relative w-12 h-12 rounded-2xl flex items-center justify-center transition-all">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="2" width="12" height="20" rx="3"/>
          <path d="M11 18h2"/>
        </svg>
      </button>
      <span class="text-[9px] font-semibold uppercase tracking-wider text-slate-400 -mt-2">Celular</span>

      <button type="button" id="dock-watch" onclick="switchDevice('watch')" title="Modo Relógio (Apple Watch)" class="dock-btn lg-sheen relative w-12 h-12 rounded-2xl flex items-center justify-center transition-all">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6.5" y="6" width="11" height="12" rx="3.5"/>
          <path d="M9 6V3h6v3"/>
          <path d="M9 18v3h6v-3"/>
          <circle cx="12" cy="12" r="1.5"/>
        </svg>
      </button>
      <span class="text-[9px] font-semibold uppercase tracking-wider text-slate-400 -mt-2">Relógio</span>
    </div>

    <!-- Indicador de Versão MVP -->
    <div class="flex flex-col items-center gap-1">
      <span class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-emerald-400/15 text-emerald-300 border border-emerald-300/30">MVP</span>
      <span class="text-[9px] text-slate-400">v1.2</span>
    </div>
  </aside>

  <!-- =========================================================================
       PALCO CENTRAL DO SIMULADOR
       ========================================================================= -->
  <main class="flex-1 flex flex-col min-w-0 h-full relative overflow-hidden">
    <!-- Barra superior discreta com informações da simulação -->
    <header class="z-20 flex items-center justify-between px-4 sm:px-6 pt-3 pb-1 shrink-0">
      <div class="lg-pill flex items-center gap-2.5 px-3.5 py-1.5 rounded-full">
        <span class="w-2 h-2 rounded-full bg-violet-300 animate-pulse shadow-[0_0_8px_rgba(196,181,253,0.8)]"></span>
        <span id="studio-device-label" class="text-xs font-semibold text-white">Celular · 390×800 (9:16)</span>
        <span class="hidden md:inline text-white/20">|</span>
        <span class="hidden md:inline text-xs text-slate-300/85">Liquid Glass UI · <strong class="text-white font-semibold">Lucas Silva</strong></span>
      </div>

      <!-- Atalhos rápidos para demonstrar telas durante a apresentação -->
      <div class="lg-pill hidden sm:flex items-center gap-1 px-2 py-1 rounded-full">
        <span class="text-[11px] text-slate-300/80 pl-2 pr-1">Ir direto:</span>
        <button type="button" onclick="navigateQuick('orbita')" class="px-2.5 py-1 rounded-full text-[11px] font-medium text-slate-100 hover:bg-white/15 transition">Órbita</button>
        <button type="button" onclick="navigateQuick('parque')" class="px-2.5 py-1 rounded-full text-[11px] font-medium text-slate-100 hover:bg-white/15 transition">Parque 2D</button>
        <button type="button" onclick="navigateQuick('comunidade')" class="px-2.5 py-1 rounded-full text-[11px] font-medium text-slate-100 hover:bg-white/15 transition">Comunidade</button>
        <button type="button" onclick="navigateQuick('perfil')" class="px-2.5 py-1 rounded-full text-[11px] font-medium text-slate-100 hover:bg-white/15 transition">Meu Hub</button>
      </div>
    </header>

    <!-- Palco onde o dispositivo escolhido é centralizado e escalado automaticamente -->
    <section id="device-stage" class="flex-1 flex items-center justify-center relative overflow-hidden p-3 sm:p-5">
      <div id="device-scaler"></div>
    </section>

    <!-- Rodapé compacto do estúdio -->
    <footer class="z-20 flex items-center justify-center px-4 pb-2.5 pt-0.5 shrink-0">
      <p id="studio-hint-text" class="lg-pill text-[11px] text-slate-200/90 px-4 py-1.5 rounded-full text-center">
        Dica: arraste as bolhas na Órbita, clique no chão ou use WASD/D-Pad no Parque 2D e alterne os dispositivos na esquerda.
      </p>
    </footer>
  </main>

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

          return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>`;

    function showDeviceToast(message, type = 'info') {
      const container = document.getElementById('device-toast-container');
      if (!container) return;

      const el = document.createElement('div');
      const isWatch = AppState.device === 'watch';
      const accent = type === 'success'
        ? 'border-emerald-300/40 bg-emerald-950/80 text-emerald-50'
        : 'border-white/25 bg-slate-900/80 text-white';

      el.className = `${isWatch ? 'text-[10px] px-3 py-1.5 rounded-2xl max-w-[230px]' : 'text-xs px-4 py-2.5 rounded-2xl max-w-[300px]'} font-medium border shadow-[0_14px_34px_rgba(2,6,23,0.5),inset_0_1px_0_rgba(255,255,255,0.3)] backdrop-blur-2xl transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto text-center ${accent}`;
      el.textContent = message;
      container.appendChild(el);

      requestAnimationFrame(() => {
        el.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        el.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => el.remove(), 320);
      }, 2700);
    }

    function copyTextSafe(text, toastMessage) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showDeviceToast(toastMessage || 'Copiado para a área de transferência!', 'success');
      } catch (err) {
        showDeviceToast(toastMessage || 'Pronto!', 'info');
      }
    }

    function copyUserOrbitLink() {
      const clean = (AppState.user.handle || 'lucassilva').replace('@', '');
      copyTextSafe(`orbit.app/${clean}`, 'Link do seu Orbit copiado! 🔗');
    }

    function copyProfileAppHandle(profileId, appId) {
      const p = SIMULATED_PROFILES.find(item => item.id === profileId);
      const app = EXTERNAL_APPS[appId];
      if (!p || !app) return;
      const handle = p.apps[appId] && p.apps[appId].handle ? p.apps[appId].handle : '';
      if (handle) {
        copyTextSafe(handle, `${handle} (${app.name}) copiado!`);
      } else {
        showDeviceToast(`${p.name} confirmou presença ativa no ${app.name}! ✨`, 'success');
      }
    }

    function copyArticleLink(postId) {
      copyTextSafe(`orbit.app/comunidade/${postId}`, 'Link público do artigo copiado! 🔗');
    }

    function cleanupActiveEngines() {
      if (activeOrbitEngine) {
        activeOrbitEngine.destroy();
        activeOrbitEngine = null;

        activeParkEngine = null;
      }

    function fitDeviceToStage() {
      const stage = document.getElementById('device-stage');
      const scaler = document.getElementById('device-scaler');
      if (!stage || !scaler) return;

      const dims = {
        desktop: { w: 1290, h: 790 },
        mobile: { w: 430, h: 840 },
        watch: { w: 325, h: 520 }
      }[AppState.device];

      const availW = Math.max(240, stage.clientWidth - 20);
      const availH = Math.max(240, stage.clientHeight - 16);
      const scale = Math.min(availW / dims.w, availH / dims.h, 1.05);

      AppState.currentScale = scale;
      scaler.style.transform = `scale(${scale.toFixed(4)})`;
    }

      if (labelEl) labelEl.textContent = labels[AppState.device];

    /* =========================================================================
       MOTOR DA GRADE RADIAL (COLMEIA APPLE WATCH COM FÍSICA FISHEYE)
       ========================================================================= */
    class OrbitHoneycombEngine {
      constructor({ container, layer, centerBtn, profiles, isWatch }) {
        this.container = container;
        this.layer = layer;
        this.centerBtn = centerBtn;
        this.profiles = profiles;
        this.isWatch = isWatch;

        this.baseRadius = isWatch ? 24 : 36;
        this.spacing = isWatch ? 64 : 104;
        this.panX = 0;
        this.panY = 0;
        this.velX = 0;
        this.velY = 0;
        this.dragging = false;
        this.moved = false;
        this.lastX = 0;
        this.lastY = 0;
        this.rafId = null;
        this.nodes = [];

        this.buildNodes();
        this.bindEvents();
        this.loop();
      }

      generateHexRingPositions(count) {
        // Anéis hexagonais concêntricos em torno de (0, 0)
        const coords = [];
        const dirs = [
          [1, 0], [0.5, Math.sqrt(3) / 2], [-0.5, Math.sqrt(3) / 2],
          [-1, 0], [-0.5, -Math.sqrt(3) / 2], [0.5, -Math.sqrt(3) / 2]
        ];
        let ring = 1;
        while (coords.length < count) {
          let x = -ring;
          let y = 0;
          // Começa no vértice esquerdo e percorre os 6 lados do anel
          const startAngle = Math.PI / 6;
          for (let side = 0; side < 6 && coords.length < count; side++) {
            const a1 = startAngle + (side * Math.PI) / 3;
            const a2 = startAngle + ((side + 1) * Math.PI) / 3;
            for (let step = 0; step < ring && coords.length < count; step++) {
              const t = step / ring;
              const rx = (Math.cos(a1) * (1 - t) + Math.cos(a2) * t) * ring * this.spacing;
              const ry = (Math.sin(a1) * (1 - t) + Math.sin(a2) * t) * ring * this.spacing;
              coords.push({ x: rx, y: ry });
            }
          }
          ring++;
        }
        return coords;
      }

      buildNodes() {
        this.layer.innerHTML = '';
        this.nodes = [];

        // 1. Bolha central do usuário logado (sempre fixa no centro do radar!)
        const userInt = INTENTIONS[AppState.user.primaryIntention];
        const centerEl = document.createElement('button');
        centerEl.type = 'button';
        centerEl.className = 'absolute left-0 top-0 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-20 cursor-pointer focus:outline-none';
        centerEl.innerHTML = `
          <div class="relative flex flex-col items-center">
            <div class="rounded-full overflow-hidden shadow-2xl" style="width:${this.baseRadius * 2.15}px; height:${this.baseRadius * 2.15}px; box-shadow: 0 0 0 3px ${userInt.color}, 0 0 0 6px rgba(255,255,255,0.14), 0 12px 28px rgba(0,0,0,0.55);">
              ${createAvatarSVG(AppState.user.avatar, 96)}
            </div>
            <span class="absolute -bottom-2.5 px-2.5 py-0.5 rounded-full bg-slate-900/75 backdrop-blur-xl border border-white/30 text-[10px] font-extrabold text-white shadow-[0_4px_12px_rgba(0,0,0,0.4),inset_0_1px_0_rgba(255,255,255,0.35)]">Você</span>
          </div>
        `;
        centerEl.addEventListener('click', () => {
          if (this.moved) return;
          if (this.isWatch) setWatchPage(2);
          else setTab('perfil');
        });
        this.layer.appendChild(centerEl);
        this.centerEl = centerEl;

        // 2. Bolhas dos perfis ao redor
        const positions = this.generateHexRingPositions(this.profiles.length);
        const diameter = this.baseRadius * 2;

        this.profiles.forEach((p, idx) => {
          const intObj = INTENTIONS[p.primaryIntention];
          const el = document.createElement('button');
          el.type = 'button';
          el.className = 'absolute left-0 top-0 flex flex-col items-center cursor-pointer focus:outline-none will-change-transform';
          el.innerHTML = `
            <div class="relative group">
              <div class="rounded-full overflow-hidden transition-shadow" style="width:${diameter}px; height:${diameter}px; box-shadow: 0 0 0 2.5px ${intObj.color}, 0 0 0 ${this.isWatch ? '4px' : '5px'} rgba(255,255,255,0.12), 0 10px 22px rgba(0,0,0,0.45);">
                ${createAvatarSVG(p.avatar, 84)}
              </div>
              ${p.online ? `<span class="absolute bottom-0.5 right-0.5 ${this.isWatch ? 'w-2.5 h-2.5' : 'w-3 h-3'} rounded-full bg-emerald-400 border-2 border-slate-950"></span>` : ''}
              ${p.inPark && !this.isWatch ? `<span title="Está no Parque 2D" class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-400/90 backdrop-blur-md text-[10px] flex items-center justify-center shadow border border-white/40">🌳</span>` : ''}
            </div>
            <div class="bubble-label mt-1.5 px-2 py-0.5 rounded-full bg-slate-950/65 backdrop-blur-xl border border-white/20 ${this.isWatch ? 'text-[9px]' : 'text-[10px]'} font-bold text-white whitespace-nowrap shadow-[inset_0_1px_0_rgba(255,255,255,0.22)]">
              ${p.name} <span class="text-slate-300/80 font-normal">${p.dist}</span>
            </div>
          `;
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            if (this.moved) return;
            openProfileModal(p.id);
          });
          this.layer.appendChild(el);
          this.nodes.push({
            el,
            labelEl: el.querySelector('.bubble-label'),
            bx: positions[idx].x,
            by: positions[idx].y
          });
        });
      }

      bindEvents() {
        this.onPointerDown = (e) => {
          this.dragging = true;
          this.moved = false;
          this.lastX = e.clientX;
          this.lastY = e.clientY;
          this.velX = 0;
          this.velY = 0;
        };

        this.onPointerMove = (e) => {
          if (!this.dragging) return;
          const scale = AppState.currentScale || 1;
          const dx = (e.clientX - this.lastX) / scale;
          const dy = (e.clientY - this.lastY) / scale;
          if (Math.hypot(dx, dy) > 2.5) this.moved = true;
          this.panX += dx;
          this.panY += dy;
          this.velX = dx * 0.7;
          this.velY = dy * 0.7;
          this.lastX = e.clientX;
          this.lastY = e.clientY;
        };

        this.onPointerUp = () => {
          this.dragging = false;
          setTimeout(() => { this.moved = false; }, 60);
        };

        this.onCenterClick = () => {
          this.velX = -this.panX * 0.18;
          this.velY = -this.panY * 0.18;
        };

        this.container.addEventListener('pointerdown', this.onPointerDown);
        window.addEventListener('pointermove', this.onPointerMove);
        window.addEventListener('pointerup', this.onPointerUp);
        if (this.centerBtn) this.centerBtn.addEventListener('click', this.onCenterClick);
      }

      loop() {
        const w = this.container.clientWidth || 360;
        const h = this.container.clientHeight || 520;
        const cx = w / 2;
        const cy = h / 2 - (AppState.device === 'mobile' ? 18 : 0);

        if (!this.dragging) {
          this.panX += this.velX;
          this.panY += this.velY;
          this.velX *= 0.90;
          this.velY *= 0.90;

          // Limite elástico suave
          const maxPan = this.isWatch ? 165 : 240;
          const distPan = Math.hypot(this.panX, this.panY);
          if (distPan > maxPan) {
            const pull = (distPan - maxPan) * 0.12;
            this.panX -= (this.panX / distPan) * pull;
            this.panY -= (this.panY / distPan) * pull;
          }
        }

        // Centro do usuário permanece ancorado no centro visual do radar
        if (this.centerEl) {
          this.centerEl.style.left = `${cx}px`;
          this.centerEl.style.top = `${cy}px`;
        }

        const maxDist = Math.min(w, h) * 0.56;

        for (let i = 0; i < this.nodes.length; i++) {
          const n = this.nodes[i];
          let rx = n.bx + this.panX;
          let ry = n.by + this.panY;

          // Repulsão suave para nenhuma bolha ficar exatamente atrás do avatar central do usuário
          const dCenter = Math.hypot(rx, ry);
          const minClear = this.isWatch ? 54 : 84;
          if (dCenter > 0.1 && dCenter < minClear) {
            const push = (minClear - dCenter);
            rx += (rx / dCenter) * push;
            ry += (ry / dCenter) * push;
          }

          const distFromCenter = Math.hypot(rx, ry);
          const norm = Math.min(1, distFromCenter / Math.max(120, maxDist));
          // Curva fisheye (maiores perto do centro, menores nas bordas estilo Apple Watch)
          const scale = 1.12 - norm * 0.56;
          const opacity = 1 - Math.pow(norm, 2.2) * 0.52;

          const x = cx + rx;
          const y = cy + ry;
          n.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) translate(-50%, -50%) scale(${scale.toFixed(3)})`;
          n.el.style.opacity = opacity.toFixed(3);
          n.el.style.zIndex = String(Math.round((1 - norm) * 15) + 1);
          if (n.labelEl) {
            n.labelEl.style.opacity = scale > 0.72 ? '1' : '0';
          }
        }

        this.rafId = requestAnimationFrame(() => this.loop());
      }

      destroy() {
        if (this.rafId) cancelAnimationFrame(this.rafId);
        this.container.removeEventListener('pointerdown', this.onPointerDown);
        window.removeEventListener('pointermove', this.onPointerMove);
        window.removeEventListener('pointerup', this.onPointerUp);
        if (this.centerBtn) this.centerBtn.removeEventListener('click', this.onCenterClick);
      }
    }

      resize() {
        const w = Math.max(240, this.wrap.clientWidth || 390);
        const h = Math.max(240, this.wrap.clientHeight || 540);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.viewW = w;
        this.viewH = h;
        this.canvas.width = Math.round(w * dpr);
        this.canvas.height = Math.round(h * dpr);
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      screenToWorld(clientX, clientY) {
        const rect = this.canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return { x: this.player.x, y: this.player.y };
        const sx = (clientX - rect.left) * (this.viewW / rect.width);
        const sy = (clientY - rect.top) * (this.viewH / rect.height);
        return {
          x: Math.max(24, Math.min(this.worldW - 24, sx + this.camX)),
          y: Math.max(24, Math.min(this.worldH - 24, sy + this.camY))
        };
      }

      collidesAt(x, y, radius = 13) {
        if (x < 22 || x > this.worldW - 22 || y < 22 || y > this.worldH - 22) return true;
        for (let i = 0; i < this.obstacles.length; i++) {
          const ob = this.obstacles[i];
          if (ob.type === 'circle') {
            if (Math.hypot(x - ob.x, y - ob.y) < ob.r + radius) return true;
          } else {
            const cx = Math.max(ob.x, Math.min(x, ob.x + ob.w));
            const cy = Math.max(ob.y, Math.min(y, ob.y + ob.h));
            if (Math.hypot(x - cx, y - cy) < radius) return true;
          }
        }
        return false;
      }

      ensureUnstuck() {
        if (!this.collidesAt(this.player.x, this.player.y, this.player.r)) return;
        for (let dist = 8; dist <= 96; dist += 8) {
          for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
            const nx = this.player.x + Math.cos(a) * dist;
            const ny = this.player.y + Math.sin(a) * dist;
            if (!this.collidesAt(nx, ny, this.player.r)) {
              this.player.x = nx;
              this.player.y = ny;
              return;
            }
          }
        }
      }

      bindEvents() {
        this.onResize = () => this.resize();
        window.addEventListener('resize', this.onResize);

        this.onKeyDown = (e) => {
          const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
          if (tag === 'input' || tag === 'textarea') return;
          const k = e.key.toLowerCase();
          let handled = true;
          if (k === 'w' || k === 'arrowup') this.keys.up = true;
          else if (k === 's' || k === 'arrowdown') this.keys.down = true;
          else if (k === 'a' || k === 'arrowleft') this.keys.left = true;
          else if (k === 'd' || k === 'arrowright') this.keys.right = true;
          else handled = false;

          if (handled) {
            e.preventDefault();
            this.player.targetX = null;
            this.player.targetY = null;
          }
        };

        this.onKeyUp = (e) => {
          const k = e.key.toLowerCase();
          if (k === 'w' || k === 'arrowup') this.keys.up = false;
          if (k === 's' || k === 'arrowdown') this.keys.down = false;
          if (k === 'a' || k === 'arrowleft') this.keys.left = false;
          if (k === 'd' || k === 'arrowright') this.keys.right = false;
        };

        window.addEventListener('keydown', this.onKeyDown);
        window.addEventListener('keyup', this.onKeyUp);

        this.onPointerDown = (e) => {
          e.preventDefault();
          const pt = this.screenToWorld(e.clientX, e.clientY);

          // Verifica clique no gatinho Paçoca
          if (Math.hypot(pt.x - this.pacoca.x, pt.y - this.pacoca.y) < 34) {
            this.triggerPacoca();
          }

          // Verifica clique no Quiosque Café Orbit
          if (pt.x >= 150 && pt.x <= 335 && pt.y >= 125 && pt.y <= 230) {
            showDeviceToast('☕ Café Orbit: você pediu um iced latte virtual!', 'success');
            this.player.targetX = 245;
            this.player.targetY = 258;
            this.targetPulse = 1;
            return;
          }

          // Verifica clique no Totem Saúde & Comunidade
          if (pt.x >= 870 && pt.x <= 996 && pt.y >= 155 && pt.y <= 227) {
            showDeviceToast('🛡️ Totem Saúde: acesse a aba Comunidade para guias de PrEP e vacinas!', 'info');
            this.player.targetX = 930;
            this.player.targetY = 252;
            this.targetPulse = 1;
            return;
          }

          // Verifica clique direto em algum bot
          for (let i = 0; i < this.bots.length; i++) {
            const b = this.bots[i];
            if (Math.hypot(pt.x - b.x, pt.y - b.y) < 34) {
              this.player.targetX = b.x;
              this.player.targetY = b.y + 42;
              if (this.collidesAt(this.player.targetX, this.player.targetY, this.player.r)) {
                this.player.targetY = b.y - 42;
              }
              this.targetPulse = 1;
              this.focusBot(b, true);
              return;
            }
          }

          // Clique no chão: anda até o ponto e permite arrastar continuamente
          this.pointerWalking = true;
          this.player.targetX = pt.x;
          this.player.targetY = pt.y;
          this.targetPulse = 1;
        };

        this.onPointerMove = (e) => {
          if (!this.pointerWalking) return;
          const pt = this.screenToWorld(e.clientX, e.clientY);
          this.player.targetX = pt.x;
          this.player.targetY = pt.y;
          this.targetPulse = 0.85;
        };

        this.onPointerUp = () => {
          this.pointerWalking = false;
        };

        this.canvas.addEventListener('pointerdown', this.onPointerDown);
        window.addEventListener('pointermove', this.onPointerMove);
        window.addEventListener('pointerup', this.onPointerUp);

        // Eventos do D-Pad na tela
        this.dpadHandlers = [];
        if (this.dpadEl) {
          this.dpadEl.querySelectorAll('[data-dpad]').forEach((btn) => {
            const dir = btn.getAttribute('data-dpad');
            const down = (e) => {
              e.preventDefault();
              e.stopPropagation();
              this.dpadState[dir] = true;
              this.player.targetX = null;
              this.player.targetY = null;
            };
            const up = () => {
              this.dpadState[dir] = false;
            };
            btn.addEventListener('pointerdown', down);
            btn.addEventListener('pointerup', up);
            btn.addEventListener('pointerleave', up);
            btn.addEventListener('pointercancel', up);
            this.dpadHandlers.push({ btn, down, up });
          });
        }

        // Chat rápido sobre o avatar do jogador
        this.onChatSubmit = (e) => {
          e.preventDefault();
          const msg = (this.chatInput.value || '').trim();
          if (!msg) return;
          this.player.speech = msg;
          this.player.speechTimer = 5.5;
          this.chatInput.value = '';
          this.chatInput.blur();
        };
        if (this.chatForm) this.chatForm.addEventListener('submit', this.onChatSubmit);
      }

      triggerPacoca() {
        this.pacocaSpeechTimer = 4.5;
        if (!AppState.foundPacoca) {
          AppState.foundPacoca = true;
          showDeviceToast('🐱 Você encontrou o Paçoca perto do Café Orbit! Avise o Matheus!', 'success');
        }
      }

      getBotLine(bot) {
        const pool = (bot.id === 'p1' && AppState.foundPacoca && bot.foundLines) ? bot.foundLines : bot.lines;
        return pool[bot.lineIndex % pool.length];
      }

      cycleBotDialogue(botId) {
        const bot = this.bots.find(b => b.id === botId);
        if (!bot) return;
        bot.lineIndex++;
        this.renderBotCard(bot);
      }

      focusBot(bot, forceCycle = false) {
        if (forceCycle && this.activeBotId === bot.id) {
          bot.lineIndex++;
        }
        this.activeBotId = bot.id;
        this.renderBotCard(bot);
      }

      renderBotCard(bot) {
        if (!this.botCard) return;
        if (!bot) {
          this.botCard.classList.add('hidden');
          this.activeBotId = null;
          return;
        }
        const profile = SIMULATED_PROFILES.find(p => p.id === bot.id);
        const prim = profile ? INTENTIONS[profile.primaryIntention] : INTENTIONS.troca;
        const line = this.getBotLine(bot);

        this.botCard.classList.remove('hidden');
        this.botCard.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-11 h-11 rounded-full overflow-hidden shrink-0" style="box-shadow: 0 0 0 2px ${prim.color};">
              ${profile ? createAvatarSVG(profile.avatar, 44) : ''}
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <div class="text-xs font-extrabold text-white flex items-center gap-1.5">
                  <span>${bot.name}</span>
                  <span class="px-2 py-0.5 rounded-full text-[9px] font-bold" style="background:${prim.bg}; color:${prim.color}">${prim.emoji} ${prim.short}</span>
                </div>
                <button type="button" onclick="openProfileModal('${bot.id}')" class="lg-pill px-2.5 py-1 rounded-full text-[10px] font-bold text-white shrink-0">
                  Ver Perfil
                </button>
              </div>
              <p class="text-xs text-slate-100/95 leading-snug mt-1.5">"${escapeHtml(line)}"</p>
              <div class="flex items-center justify-between mt-2">
                <span class="text-[10px] text-emerald-300/90">● Perto de você no Parque</span>
                <button type="button" onclick="cycleBotDialogue('${bot.id}')" class="text-[10px] font-bold text-violet-200 hover:text-white transition">
                  Continuar papo →
                </button>
              </div>
            </div>
          </div>
        `;
      }

      update(dt) {
        this.time += dt;
        this.ensureUnstuck();

        if (this.player.speechTimer > 0) {
          this.player.speechTimer = Math.max(0, this.player.speechTimer - dt);
          if (this.player.speechTimer === 0) this.player.speech = null;
        }
        if (this.pacocaSpeechTimer > 0) {
          this.pacocaSpeechTimer = Math.max(0, this.pacocaSpeechTimer - dt);
        }
        if (this.targetPulse > 0) {
          this.targetPulse = Math.max(0, this.targetPulse - dt * 1.4);
        }

        // Direção via teclado ou D-Pad
        let vx = 0;
        let vy = 0;
        if (this.keys.left || this.dpadState.left) vx -= 1;
        if (this.keys.right || this.dpadState.right) vx += 1;
        if (this.keys.up || this.dpadState.up) vy -= 1;
        if (this.keys.down || this.dpadState.down) vy += 1;

        let moving = false;
        if (vx !== 0 || vy !== 0) {
          const len = Math.hypot(vx, vy);
          vx = (vx / len) * this.player.speed * dt;
          vy = (vy / len) * this.player.speed * dt;
          moving = true;
        } else if (this.player.targetX !== null && this.player.targetY !== null) {
          const dx = this.player.targetX - this.player.x;
          const dy = this.player.targetY - this.player.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 5) {
            const step = Math.min(dist, this.player.speed * dt);
            vx = (dx / dist) * step;
            vy = (dy / dist) * step;
            moving = true;
          } else {
            this.player.targetX = null;
            this.player.targetY = null;
          }
        }

        if (moving) {
          // Colisão deslizante separada em X e Y
          const prevX = this.player.x;
          const prevY = this.player.y;
          if (!this.collidesAt(this.player.x + vx, this.player.y, this.player.r)) {
            this.player.x += vx;
          }
          if (!this.collidesAt(this.player.x, this.player.y + vy, this.player.r)) {
            this.player.y += vy;
          }

          // Se travou no clique automático em algum obstáculo, cancela o alvo
          if (this.player.targetX !== null && Math.hypot(this.player.x - prevX, this.player.y - prevY) < 0.25 && !this.pointerWalking) {
            this.player.targetX = null;
            this.player.targetY = null;
          }

          this.player.walkPhase += dt * 11;
          if (Math.abs(vx) > Math.abs(vy)) {
            this.player.facing = vx > 0 ? 'right' : 'left';
          } else {
            this.player.facing = vy > 0 ? 'down' : 'up';
          }
        } else {
          this.player.walkPhase = 0;
        }

        // Proximidade com o gatinho Paçoca
        if (Math.hypot(this.player.x - this.pacoca.x, this.player.y - this.pacoca.y) < 62) {
          this.triggerPacoca();
        }

        // Atualiza bots e verifica proximidade
        let nearestBot = null;
        let nearestDist = 92;

        for (let i = 0; i < this.bots.length; i++) {
          const b = this.bots[i];
          const distToPlayer = Math.hypot(b.x - this.player.x, b.y - this.player.y);

          if (distToPlayer < nearestDist) {
            nearestDist = distToPlayer;
            nearestBot = b;
          }

          // Se o jogador está perto, o bot para para conversar
          if (distToPlayer < 88) {
            b.walkPhase = 0;
            continue;
          }

          if (b.pauseTimer > 0) {
            b.pauseTimer -= dt;
            b.walkPhase = 0;
            continue;
          }

          const wp = b.waypoints[b.wpIndex];
          const dx = wp.x - b.x;
          const dy = wp.y - b.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 6) {
            b.wpIndex = (b.wpIndex + 1) % b.waypoints.length;
            b.pauseTimer = 1.6 + (i % 3) * 0.7;
            b.walkPhase = 0;
          } else {
            const step = Math.min(dist, b.speed * dt);
            const nx = b.x + (dx / dist) * step;
            const ny = b.y + (dy / dist) * step;
            if (!this.collidesAt(nx, ny, 12)) {
              b.x = nx;
              b.y = ny;
              b.walkPhase += dt * 7.5;
            } else {
              b.wpIndex = (b.wpIndex + 1) % b.waypoints.length;
              b.pauseTimer = 1.0;
            }
          }
        }

        if (nearestBot) {
          if (this.activeBotId !== nearestBot.id) {
            this.focusBot(nearestBot, false);
          }
        } else if (this.activeBotId !== null) {
          this.renderBotCard(null);
        }

        // Câmera suave seguindo o jogador
        const desiredCamX = Math.max(0, Math.min(this.worldW - this.viewW, this.player.x - this.viewW / 2));
        const desiredCamY = Math.max(0, Math.min(this.worldH - this.viewH, this.player.y - this.viewH / 2));
        this.camX += (desiredCamX - this.camX) * Math.min(1, dt * 8);
        this.camY += (desiredCamY - this.camY) * Math.min(1, dt * 8);
      }

      drawWorld() {
        const ctx = this.ctx;
        ctx.save();
        ctx.clearRect(0, 0, this.viewW, this.viewH);
        ctx.translate(-Math.round(this.camX), -Math.round(this.camY));

        // 1. Gramado pixel art quadriculado
        const tile = 32;
        const startCol = Math.max(0, Math.floor(this.camX / tile));
        const endCol = Math.min(Math.ceil(this.worldW / tile), Math.ceil((this.camX + this.viewW) / tile));
        const startRow = Math.max(0, Math.floor(this.camY / tile));
        const endRow = Math.min(Math.ceil(this.worldH / tile), Math.ceil((this.camY + this.viewH) / tile));

        for (let r = startRow; r < endRow; r++) {
          for (let c = startCol; c < endCol; c++) {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#2f7a47' : '#2a6f40';
            ctx.fillRect(c * tile, r * tile, tile, tile);
          }
        }

        // 2. Caminhos de areia e praça central circular
        ctx.fillStyle = '#c8b896';
        // Cruz principal
        ctx.fillRect(552, 0, 96, this.worldH);
        ctx.fillRect(0, 404, this.worldW, 92);
        // Alamedas superiores conectando Café e Totem
        ctx.fillRect(190, 232, 820, 56);
        // Praça circular central
        ctx.beginPath();
        ctx.arc(600, 450, 152, 0, Math.PI * 2);
        ctx.fill();

        // Pedrinhas sutis no caminho
        ctx.fillStyle = '#b6a47e';
        for (let i = 0; i < 42; i++) {
          const px = 560 + ((i * 37) % 80);
          const py = 30 + ((i * 89) % 840);
          ctx.fillRect(px, py, 5, 4);
        }

        // 3. Flores no gramado
        for (let i = 0; i < this.flowers.length; i++) {
          const f = this.flowers[i];
          ctx.fillStyle = '#14532d';
          ctx.fillRect(f.x - 1, f.y + 2, 4, 3);
          ctx.fillStyle = f.color;
          ctx.fillRect(f.x - 2, f.y - 2, 5, 5);
        }

        // 4. Marcador de destino no chão (quando o usuário clica/toca)
        if (this.player.targetX !== null && this.player.targetY !== null) {
          const pulse = 8 + Math.sin(this.time * 8) * 3;
          ctx.strokeStyle = 'rgba(196, 181, 253, 0.9)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(this.player.targetX, this.player.targetY, pulse, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = 'rgba(167, 139, 250, 0.35)';
          ctx.beginPath();
          ctx.arc(this.player.targetX, this.player.targetY, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        // 5. Fonte central animada
        ctx.fillStyle = 'rgba(15, 23, 42, 0.25)';
        ctx.beginPath();
        ctx.arc(600, 456, 62, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#64748b';
        ctx.beginPath();
        ctx.arc(600, 450, 58, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.beginPath();
        ctx.arc(600, 450, 50, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0ea5e9';
        ctx.beginPath();
        ctx.arc(600, 450, 42, 0, Math.PI * 2);
        ctx.fill();
        // Ondas d'água animadas
        const ripple = 14 + ((this.time * 16) % 24);
        ctx.strokeStyle = `rgba(224, 242, 254, ${Math.max(0, 0.85 - (ripple - 14) / 28)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(600, 450, ripple, 0, Math.PI * 2);
        ctx.stroke();
        // Centro de pedra da fonte
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(590, 440, 20, 20);
        ctx.fillStyle = '#bae6fd';
        ctx.fillRect(596, 444 + Math.sin(this.time * 10) * 2, 8, 8);

        // 6. Quiosque Café Orbit (Noroeste)
        this.drawCafeKiosk(ctx);

        // 7. Totem Saúde & Comunidade (Nordeste)
        this.drawHealthTotem(ctx);

        // 8. Bancos de madeira
        const benches = this.obstacles.filter(o => o.kind === 'bench');
        benches.forEach(b => {
          ctx.fillStyle = 'rgba(0,0,0,0.22)';
          ctx.fillRect(b.x + 2, b.y + 4, b.w, b.h);
          ctx.fillStyle = '#92400e';
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.fillStyle = '#b45309';
          ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 6);
          ctx.fillRect(b.x + 2, b.y + 11, b.w - 4, 6);
        });

        // 9. Postes de luz com halo suave
        const lamps = [
          { x: 600, y: 315 }, { x: 600, y: 605 }, { x: 460, y: 450 }, { x: 740, y: 450 }
        ];
        lamps.forEach(l => {
          const g = ctx.createRadialGradient(l.x, l.y - 16, 2, l.x, l.y - 16, 36);
          g.addColorStop(0, 'rgba(254, 240, 138, 0.36)');
          g.addColorStop(1, 'rgba(254, 240, 138, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(l.x, l.y - 16, 36, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#334155';
          ctx.fillRect(l.x - 2, l.y - 18, 4, 22);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(l.x - 4, l.y - 23, 8, 7);
        });

        // 10. Arbusto + Gatinho Paçoca (Easter Egg)
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.arc(352, 206, 18, 0, Math.PI * 2);
        ctx.arc(374, 202, 16, 0, Math.PI * 2);
        ctx.fill();
        this.drawPacoca(ctx);

        // 11. Entidades ordenadas por Y (profundidade 2.5D: árvores, bots e jogador)
        const drawables = [];
        this.trees.forEach(t => drawables.push({ y: t.y, type: 'tree', data: t }));
        this.bots.forEach(b => drawables.push({ y: b.y, type: 'bot', data: b }));
        drawables.push({ y: this.player.y, type: 'player', data: this.player });
        drawables.sort((a, b) => a.y - b.y);

        drawables.forEach(item => {
          if (item.type === 'tree') this.drawTree(ctx, item.data.x, item.data.y);
          else if (item.type === 'bot') this.drawCharacter(ctx, item.data, false);
          else this.drawCharacter(ctx, item.data, true);
        });

        // 12. Balões de fala por cima de tudo
        if (this.pacocaSpeechTimer > 0) {
          this.drawSpeechBubble(ctx, this.pacoca.x, this.pacoca.y - 24, 'Miau! 🐱 (Paçoca)');
        }
        if (this.activeBotId) {
          const b = this.bots.find(item => item.id === this.activeBotId);
          if (b) this.drawSpeechBubble(ctx, b.x, b.y - 46, this.getBotLine(b));
        }
        if (this.player.speech) {
          this.drawSpeechBubble(ctx, this.player.x, this.player.y - 46, this.player.speech, true);
        }

        ctx.restore();
      }

      drawCafeKiosk(ctx) {
        // Sombra
        ctx.fillStyle = 'rgba(0,0,0,0.24)';
        ctx.fillRect(156, 134, 185, 102);
        // Paredes
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(150, 155, 185, 75);
        // Balcão
        ctx.fillStyle = '#78350f';
        ctx.fillRect(166, 204, 153, 20);
        // Toldo listrado
        for (let i = 0; i < 8; i++) {
          ctx.fillStyle = i % 2 === 0 ? '#7c3aed' : '#e9d5ff';
          ctx.fillRect(146 + i * 24, 125, 24, 34);
        }
        // Placa
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(184, 165, 118, 24);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('☕ CAFÉ ORBIT', 243, 181);
      }

      drawHealthTotem(ctx) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(876, 162, 126, 70);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(870, 155, 126, 72);
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(872, 157, 122, 68);
        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 10px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🛡️ SAÚDE & PREP', 933, 183);
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '600 9px Inter, sans-serif';
        ctx.fillText('Guia Público SUS', 933, 202);
      }

      drawPacoca(ctx) {
        const x = this.pacoca.x;
        const y = this.pacoca.y;
        const bob = Math.sin(this.time * 4) * 1.2;
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(x, y + 6, 9, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        // Corpinho laranja
        ctx.fillStyle = '#f97316';
        ctx.fillRect(x - 7, y - 4 + bob, 14, 9);
        // Cabeça + orelhinhas
        ctx.fillRect(x - 5, y - 11 + bob, 10, 8);
        ctx.fillRect(x - 5, y - 14 + bob, 3, 3);
        ctx.fillRect(x + 2, y - 14 + bob, 3, 3);
        // Olhinhos
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(x - 3, y - 8 + bob, 2, 2);
        ctx.fillRect(x + 1, y - 8 + bob, 2, 2);
      }

      drawTree(ctx, x, y) {
        ctx.fillStyle = 'rgba(0,0,0,0.24)';
        ctx.beginPath();
        ctx.ellipse(x, y + 18, 22, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        // Tronco
        ctx.fillStyle = '#713f12';
        ctx.fillRect(x - 6, y - 2, 12, 22);
        // Copa pixelada em camadas
        ctx.fillStyle = '#14532d';
        ctx.fillRect(x - 22, y - 28, 44, 28);
        ctx.fillStyle = '#166534';
        ctx.fillRect(x - 18, y - 36, 36, 26);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(x - 12, y - 40, 24, 16);
      }

      drawCharacter(ctx, ch, isPlayer) {
        const x = Math.round(ch.x);
        const y = Math.round(ch.y);
        const step = Math.sin(ch.walkPhase || 0) * 3.5;

        // Anel luminoso no chão (jogador ou bot ativo)
        if (isPlayer) {
          ctx.strokeStyle = '#c4b5fd';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(x, y + 6, 16, 7, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else if (this.activeBotId === ch.id) {
          ctx.strokeStyle = '#6ee7b7';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(x, y + 6, 16, 7, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Sombra
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        ctx.beginPath();
        ctx.ellipse(x, y + 6, 11, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pernas animadas
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x - 6, y - 3 + (step > 0 ? -step * 0.5 : 0), 5, 9);
        ctx.fillRect(x + 1, y - 3 + (step < 0 ? step * 0.5 : 0), 5, 9);

        // Tronco (camiseta)
        ctx.fillStyle = isPlayer ? '#a855f7' : ch.shirt;
        ctx.fillRect(x - 8, y - 18, 16, 16);

        // Cabeça
        ctx.fillStyle = isPlayer ? AppState.user.avatar.skin : ch.skin;
        ctx.fillRect(x - 7, y - 32, 14, 14);

        // Cabelo
        ctx.fillStyle = isPlayer ? AppState.user.avatar.hair : ch.hair;
        ctx.fillRect(x - 8, y - 35, 16, 6);

        // Olhos
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(x - 4, y - 26, 2, 2);
        ctx.fillRect(x + 2, y - 26, 2, 2);

        // Tag de nome
        const label = isPlayer ? `${AppState.user.firstName} (Você)` : ch.name;
        ctx.font = 'bold 10px Inter, sans-serif';
        const tw = ctx.measureText(label).width;
        const bw = tw + 14;
        const bx = x - bw / 2;
        const by = y + 11;

        ctx.fillStyle = isPlayer ? 'rgba(124, 58, 237, 0.92)' : 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, 17, 8);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, by + 12);
      }

      drawSpeechBubble(ctx, x, y, text, isPlayer = false) {
        const display = text.length > 44 ? text.slice(0, 42) + '…' : text;
        ctx.font = '600 10.5px Inter, sans-serif';
        const tw = ctx.measureText(display).width;
        const bw = Math.max(64, tw + 18);
        const bh = 24;
        const bx = Math.round(x - bw / 2);
        const by = Math.round(y - bh);

        ctx.fillStyle = isPlayer ? 'rgba(109, 40, 217, 0.94)' : 'rgba(15, 23, 42, 0.92)';
        ctx.strokeStyle = isPlayer ? 'rgba(221, 214, 254, 0.7)' : 'rgba(255, 255, 255, 0.28)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 11);
        ctx.fill();
        ctx.stroke();

        // Pontinha do balão
        ctx.beginPath();
        ctx.moveTo(x - 5, by + bh);
        ctx.lineTo(x + 5, by + bh);
        ctx.lineTo(x, by + bh + 5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(display, x, by + 15.5);
      }

      loop(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - this.lastFrame) / 1000));
        this.lastFrame = now;
        this.update(dt);
        this.drawWorld();
        this.rafId = requestAnimationFrame((t) => this.loop(t));
      }

      destroy() {
        if (this.rafId) cancelAnimationFrame(this.rafId);
        window.removeEventListener('resize', this.onResize);
        window.removeEventListener('keydown', this.onKeyDown);
        window.removeEventListener('keyup', this.onKeyUp);
        this.canvas.removeEventListener('pointerdown', this.onPointerDown);
        window.removeEventListener('pointermove', this.onPointerMove);
        window.removeEventListener('pointerup', this.onPointerUp);
        if (this.chatForm) this.chatForm.removeEventListener('submit', this.onChatSubmit);
        this.dpadHandlers.forEach(({ btn, down, up }) => {
          btn.removeEventListener('pointerdown', down);
          btn.removeEventListener('pointerup', up);
          btn.removeEventListener('pointerleave', up);
          btn.removeEventListener('pointercancel', up);
        });
      }
    }

    function setCommunityFilter(cat) {
      AppState.communityFilter = cat;
      renderActiveScreen();
    }

    function togglePostLike(postId, event) {
      if (event) event.stopPropagation();
      const post = COMMUNITY_POSTS.find(p => p.id === postId);
      if (!post) return;
      post.liked = !post.liked;
      post.likes += post.liked ? 1 : -1;
      if (AppState.selectedArticleId === postId) renderDeviceModals();
      if (AppState.activeTab === 'comunidade') renderComunidadeScreen();
    }

    function submitArticleComment(postId, event) {
      event.preventDefault();
      const input = document.getElementById('article-comment-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      const post = COMMUNITY_POSTS.find(p => p.id === postId);
      if (!post) return;
      post.comments.push({ author: AppState.user.name, time: 'agora', text });
      input.value = '';
      renderDeviceModals();
      if (AppState.activeTab === 'comunidade') renderComunidadeScreen();
      showDeviceToast('Comentário publicado na comunidade! 💬', 'success');
    }

       ========================================================================= */
    function refreshLiveHubPreview() {
      const box = document.getElementById('live-hub-preview');
      if (box) box.innerHTML = renderUserHubPreviewCard();
      renderNavigation();
    }

    function togglePrivacy() {
      AppState.user.isPublic = !AppState.user.isPublic;
      showDeviceToast(
        AppState.user.isPublic ? 'Seu perfil agora está Público na Órbita 🌐' : 'Perfil alterado para Modo Privado 🔒',
        'info'
      );
      if (AppState.device === 'watch') renderWatchScreen();
      else renderPerfilScreen();
    }

    function updateUserBio(val) {
      AppState.user.bio = val;
      refreshLiveHubPreview();
    }

    function toggleUserIntention(id) {
      const idx = AppState.user.intentions.indexOf(id);
      if (idx >= 0) {
        if (AppState.user.intentions.length <= 1) {
          showDeviceToast('Mantenha pelo menos uma tag ativa no seu Hub.');
          return;
        }
        AppState.user.intentions.splice(idx, 1);
        if (AppState.user.primaryIntention === id) {
          AppState.user.primaryIntention = AppState.user.intentions[0];
        }
      } else {
        AppState.user.intentions.push(id);
      }
      renderPerfilScreen();
    }

    function setPrimaryIntention(id) {
      if (!AppState.user.intentions.includes(id)) {
        AppState.user.intentions.push(id);
      }
      AppState.user.primaryIntention = id;
      showDeviceToast(`Anel principal atualizado para ${INTENTIONS[id].label} ★`, 'success');
      renderPerfilScreen();
    }

    function toggleExternalApp(appId) {
      const st = AppState.user.apps[appId];
      if (!st) return;
      st.active = !st.active;
      showDeviceToast(
        st.active ? `Selo do ${EXTERNAL_APPS[appId].name} ativado no seu Hub!` : `Selo do ${EXTERNAL_APPS[appId].name} ocultado.`,
        st.active ? 'success' : 'info'
      );
      renderPerfilScreen();
    }

    function updateExternalHandle(appId, val) {
      if (!AppState.user.apps[appId]) return;
      AppState.user.apps[appId].handle = val;
      refreshLiveHubPreview();
    }

      closeDeviceModals();

                  <div class="space-y-2.5">
                    ${post.comments.map(c => `
                      <div class="p-3 rounded-2xl bg-white/[0.06] border border-white/[0.11]">
                        <div class="flex items-center justify-between text-[11px]">
                          <span class="font-bold text-violet-200">${escapeHtml(c.author)}</span>
                          <span class="text-slate-400">${escapeHtml(c.time)}</span>
                        </div>
                        <p class="text-xs text-slate-100/90 mt-1 leading-relaxed">${escapeHtml(c.text)}</p>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>

              <!-- Formulário de Novo Comentário -->
              <form onsubmit="submitArticleComment('${post.id}', event)" class="p-3.5 border-t border-white/[0.12] bg-slate-950/45 flex items-center gap-2 shrink-0">
                <input id="article-comment-input" type="text" placeholder="Escreva um comentário..." class="flex-1 bg-white/[0.08] border border-white/15 focus:border-white/35 rounded-full px-4 py-2 text-xs text-white placeholder-slate-300/75 outline-none"/>
                <button type="submit" class="lg-btn-primary px-4 py-2 rounded-full text-xs font-bold text-white shrink-0">Publicar</button>
              </form>
            </div>
          </div>
        `;
      }
    }

    /* =========================================================================
       11. BRILHO ESPECULAR INTERATIVO (LIQUID GLASS SHEEN) & INICIALIZAÇÃO
       ========================================================================= */
    document.addEventListener('pointermove', (e) => {
      const target = e.target && e.target.closest ? e.target.closest('.lg-sheen') : null;
      if (!target) return;
      const rect = target.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      target.style.setProperty('--lg-x', x.toFixed(1) + '%');
      target.style.setProperty('--lg-y', y.toFixed(1) + '%');
    }, { passive: true });

    window.addEventListener('resize', fitDeviceToStage);

    window.addEventListener('DOMContentLoaded', () => {
      updateStudioChrome();
      renderDeviceShell();
      fitDeviceToStage();
    });
  </script>
</body>
</html>
