name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          check-latest: true
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  migrate:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-db-migrate-qawlpsrfewosxsfgmmpm
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Supabase migration secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            missing+=("SUPABASE_ACCESS_TOKEN")
          fi
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            missing+=("SUPABASE_DB_PASSWORD")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secret(s): ${missing[*]}. Configure them in Settings > Secrets and variables > Actions (see docs/operations-guide.md)." >&2
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0

      - name: Link Supabase project and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref qawlpsrfewosxsfgmmpm
          echo "Running SQL migration dry-run against remote project qawlpsrfewosxsfgmmpm..."
          supabase db push --remote --dry-run
          echo "Applying pending SQL migrations to remote project qawlpsrfewosxsfgmmpm..."
          supabase db push --remote --yes

  deploy:
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          check-latest: true
          package-manager-cache: false

      - name: Verify Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account_id="${CLOUDFLARE_ACCOUNT_ID//[[:space:]]/}"
          missing=()
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            missing+=("CLOUDFLARE_API_TOKEN")
          fi
          if [ -z "${account_id}" ]; then
            missing+=("CLOUDFLARE_ACCOUNT_ID")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secret(s): ${missing[*]}. Configure them in Settings > Secrets and variables > Actions (see docs/operations-guide.md)." >&2
            exit 1
          fi
          if [[ ! "${account_id}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::Invalid CLOUDFLARE_ACCOUNT_ID secret format: must match ^[0-9a-f]{32}$ (32 lowercase hexadecimal characters) after stripping whitespace. Paste only the 32-character Account ID in Settings > Secrets and variables > Actions (see docs/operations-guide.md)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        run: npm run build

      - name: Deploy Worker with Static Assets
        id: wrangler_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID//[[:space:]]/}"
          export CLOUDFLARE_ACCOUNT_ID
          deploy_log="$(mktemp)"
          trap 'rm -f "${deploy_log}"' EXIT
          npx --yes wrangler@4.158.0 deploy 2>&1 | tee "${deploy_log}"
          workers_dev_url="$(grep -Eo 'https://vitrine-inspira\.[a-z0-9-]+\.workers\.dev' "${deploy_log}" | tail -n 1 || true)"
          if [ -n "${workers_dev_url}" ]; then
            echo "workers_dev_url=${workers_dev_url}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Post-deploy smoke check on workers.dev (/api/auth/config)
        env:
          WORKERS_DEV_URL: ${{ steps.wrangler_deploy.outputs.workers_dev_url }}
        run: |
          set -euo pipefail
          if [ -z "${WORKERS_DEV_URL}" ]; then
            echo "::error::Post-deploy smoke check failed: no workers.dev URL was captured from wrangler deploy output." >&2
            exit 1
          fi
          smoke_url="${WORKERS_DEV_URL}/api/auth/config"
          echo "Smoking ${smoke_url} (workers.dev host only; custom domains use bot challenge)..."
          trap 'rm -f /tmp/auth-config-smoke.json' EXIT
          status="$(curl -sS -o /tmp/auth-config-smoke.json -w '%{http_code}' "${smoke_url}")" || status="000"
          if [ "${status}" = "200" ] || [ "${status}" = "503" ]; then
            echo "Smoke check responded with HTTP ${status}."
          else
            echo "::error::workers.dev smoke check returned unexpected HTTP ${status} (expected 200 or 503)." >&2
            exit 1
          fi
